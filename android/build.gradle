group 'com.example.ys_play'
version '1.0'

// Modernisation Android (2026-06) : plus de `buildscript { classpath AGP }` ici. Le module est
// consommé par l'app hôte (atHome : AGP 8.11.2 / Gradle 8.14 / JDK 17), c'est SON AGP qui compile
// le plugin. Pinner un vieil AGP (7.1.2) empêchait de monter compileSdk au-delà de ~32. On garde
// uniquement les dépôts, nécessaires à la résolution de l'AAR EZVIZ et de okhttp/gson.
rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.example.ys_play'

    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        // minSdk 21 = plancher exigé par l'AAR EZVIZ (uses-sdk minSdkVersion=21). Était 16,
        // soit SOUS ce plancher (latent : ne marchait que parce que l'app hôte impose 31).
        minSdkVersion 21

        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    /*萤石SDK核心模块，必须依赖*/
//    implementation 'io.github.ezviz-open:ezviz-sdk:5.1.3'
    implementation 'io.github.ezviz-open:ezviz-sdk:5.28.4'

    // 4.19.0版本之后需要自行依赖okhttp和gson库
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'com.google.code.gson:gson:2.8.9'
}
